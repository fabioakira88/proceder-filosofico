<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Uma coluna sólida e ancorada permanece imóvel em meio a linhas de turbulência que se agitam ao redor, simbolizando a virtude estoica diante do que não depende de nós">
  <defs>
    <linearGradient id="es-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061E47"/>
      <stop offset="1" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="es-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D28A"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#es-bg)"/>

  <!-- turbulent lines radiating around, representing what is not up to us -->
  <g stroke="#F7F3EA" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 100 200 Q 300 260 460 340"/>
    <path d="M 60 380 Q 260 380 440 400"/>
    <path d="M 120 560 Q 300 480 460 460"/>
    <path d="M 1300 200 Q 1100 260 940 340"/>
    <path d="M 1340 380 Q 1140 380 960 400"/>
    <path d="M 1280 560 Q 1100 480 940 460"/>
  </g>
  <g stroke="#F7F3EA" stroke-opacity="0.12" stroke-width="1.4" fill="none">
    <path d="M 40 280 Q 260 320 470 400"/>
    <path d="M 60 480 Q 270 440 470 440"/>
    <path d="M 1360 280 Q 1140 320 930 400"/>
    <path d="M 1340 480 Q 1130 440 930 440"/>
  </g>

  <!-- the anchored column, steady at center -->
  <rect x="660" y="220" width="80" height="380" fill="url(#es-col)"/>
  <rect x="620" y="600" width="160" height="24" fill="#C9A84C" fill-opacity="0.85"/>
  <rect x="640" y="196" width="120" height="24" fill="#C9A84C" fill-opacity="0.85"/>

  <!-- concentric circle motif above: what depends on us (inner) vs what does not (outer) -->
  <circle cx="700" cy="150" r="46" fill="none" stroke="#F7F3EA" stroke-opacity="0.3" stroke-width="1.4"/>
  <circle cx="700" cy="150" r="18" fill="#E6D28A" fill-opacity="0.85"/>

  <!-- ground -->
  <line x1="0" y1="660" x2="1400" y2="660" stroke="#C9A84C" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
