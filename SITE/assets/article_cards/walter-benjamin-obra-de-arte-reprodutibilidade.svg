<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Uma moldura única envolta em brilho à esquerda, contrastando com uma grade de cópias idênticas sem brilho à direita, simbolizando a perda da aura na reprodutibilidade técnica">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061E47"/>
      <stop offset="1" stop-color="#060D1E"/>
    </linearGradient>
    <radialGradient id="wa-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6D28A" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#C9A84C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#wa-bg)"/>
  <!-- original with aura -->
  <circle cx="330" cy="394" r="260" fill="url(#wa-aura)"/>
  <rect x="220" y="284" width="220" height="220" fill="none" stroke="#F7F3EA" stroke-width="3" stroke-opacity="0.9"/>
  <rect x="240" y="304" width="180" height="180" fill="#C9A84C" fill-opacity="0.14"/>
  <path d="M 250 460 L 320 380 L 360 420 L 410 340" stroke="#E6D28A" stroke-width="3" fill="none" stroke-opacity="0.8"/>
  <circle cx="380" cy="330" r="14" fill="#E6D28A" fill-opacity="0.7"/>
  <!-- divider -->
  <line x1="700" y1="120" x2="700" y2="668" stroke="#F7F3EA" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 10"/>
  <!-- grid of flat repeated copies, no aura -->
  <g>
    <g stroke="#F7F3EA" stroke-width="1.6" stroke-opacity="0.45" fill="#F7F3EA" fill-opacity="0.05">
      <rect x="800" y="180" width="130" height="130"/>
      <rect x="960" y="180" width="130" height="130"/>
      <rect x="1120" y="180" width="130" height="130"/>
      <rect x="800" y="340" width="130" height="130"/>
      <rect x="960" y="340" width="130" height="130"/>
      <rect x="1120" y="340" width="130" height="130"/>
      <rect x="800" y="500" width="130" height="130"/>
      <rect x="960" y="500" width="130" height="130"/>
      <rect x="1120" y="500" width="130" height="130"/>
    </g>
    <g stroke="#C9A84C" stroke-width="1.4" stroke-opacity="0.5" fill="none">
      <path d="M 815 300 L 860 245 L 895 280 L 925 220" transform="translate(0,0)"/>
      <path d="M 975 300 L 1020 245 L 1055 280 L 1085 220"/>
      <path d="M 1135 300 L 1180 245 L 1215 280 L 1245 220"/>
      <path d="M 815 460 L 860 405 L 895 440 L 925 380"/>
      <path d="M 975 460 L 1020 405 L 1055 440 L 1085 380"/>
      <path d="M 1135 460 L 1180 405 L 1215 440 L 1245 380"/>
      <path d="M 815 620 L 860 565 L 895 600 L 925 540"/>
      <path d="M 975 620 L 1020 565 L 1055 600 L 1085 540"/>
      <path d="M 1135 620 L 1180 565 L 1215 600 L 1245 540"/>
    </g>
  </g>
</svg>
