<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Uma base horizontal sólida da qual se erguem linhas em ângulos diferentes rumo ao espaço aberto, simbolizando a liberdade que nasce sempre de uma situação concreta">
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060D1E"/>
      <stop offset="1" stop-color="#061E47"/>
    </linearGradient>
    <linearGradient id="sb-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#8a6f2e"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#sb-bg)"/>

  <!-- open sky glow above -->
  <radialGradient id="sb-glow" cx="50%" cy="30%" r="60%">
    <stop offset="0" stop-color="#E6D28A" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#E6D28A" stop-opacity="0"/>
  </radialGradient>
  <rect width="1400" height="788" fill="url(#sb-glow)"/>

  <!-- the situated base: solid ground band -->
  <rect x="0" y="560" width="1400" height="26" fill="url(#sb-base)" fill-opacity="0.85"/>
  <rect x="0" y="586" width="1400" height="6" fill="#C9A84C" fill-opacity="0.4"/>

  <!-- roots below, anchoring -->
  <g stroke="#C9A84C" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M 620 586 Q 600 630 560 660"/>
    <path d="M 660 586 Q 660 630 650 670"/>
    <path d="M 700 586 Q 710 630 720 670"/>
    <path d="M 740 586 Q 760 630 800 660"/>
    <path d="M 780 586 Q 800 630 830 655"/>
  </g>

  <!-- rising free lines at varied angles, escaping upward -->
  <g stroke="#F7F3EA" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round">
    <line x1="560" y1="560" x2="470" y2="230"/>
    <line x1="630" y1="560" x2="590" y2="160"/>
    <line x1="700" y1="560" x2="700" y2="120"/>
    <line x1="770" y1="560" x2="830" y2="180"/>
    <line x1="840" y1="560" x2="950" y2="260"/>
  </g>
  <g fill="#E6D28A">
    <circle cx="470" cy="230" r="6"/>
    <circle cx="590" cy="160" r="6"/>
    <circle cx="700" cy="120" r="6"/>
    <circle cx="830" cy="180" r="6"/>
    <circle cx="950" cy="260" r="6"/>
  </g>
</svg>
