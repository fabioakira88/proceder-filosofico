<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Rede hierárquica de linhas e nós convergindo para um único ponto luminoso, simbolizando a estrutura invisível do poder simbólico">
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060D1E"/>
      <stop offset="1" stop-color="#061E47"/>
    </linearGradient>
    <radialGradient id="ps-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6D28A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E6D28A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#ps-bg)"/>
  <!-- apex node -->
  <circle cx="700" cy="180" r="80" fill="url(#ps-glow)"/>
  <circle cx="700" cy="180" r="10" fill="#F7F3EA"/>
  <!-- second tier -->
  <g stroke="#C9A84C" stroke-width="1.4" stroke-opacity="0.6">
    <line x1="700" y1="180" x2="420" y2="360"/>
    <line x1="700" y1="180" x2="620" y2="360"/>
    <line x1="700" y1="180" x2="780" y2="360"/>
    <line x1="700" y1="180" x2="980" y2="360"/>
  </g>
  <g fill="#C9A84C" fill-opacity="0.8">
    <circle cx="420" cy="360" r="6"/>
    <circle cx="620" cy="360" r="6"/>
    <circle cx="780" cy="360" r="6"/>
    <circle cx="980" cy="360" r="6"/>
  </g>
  <!-- third tier, wide and diffuse -->
  <g stroke="#C9A84C" stroke-width="1" stroke-opacity="0.35">
    <line x1="420" y1="360" x2="220" y2="560"/>
    <line x1="420" y1="360" x2="360" y2="560"/>
    <line x1="620" y1="360" x2="500" y2="560"/>
    <line x1="620" y1="360" x2="600" y2="560"/>
    <line x1="780" y1="360" x2="760" y2="560"/>
    <line x1="780" y1="360" x2="860" y2="560"/>
    <line x1="980" y1="360" x2="1000" y2="560"/>
    <line x1="980" y1="360" x2="1140" y2="560"/>
  </g>
  <g fill="#F7F3EA" fill-opacity="0.55">
    <circle cx="220" cy="560" r="3.5"/>
    <circle cx="360" cy="560" r="3.5"/>
    <circle cx="500" cy="560" r="3.5"/>
    <circle cx="600" cy="560" r="3.5"/>
    <circle cx="760" cy="560" r="3.5"/>
    <circle cx="860" cy="560" r="3.5"/>
    <circle cx="1000" cy="560" r="3.5"/>
    <circle cx="1140" cy="560" r="3.5"/>
  </g>
  <!-- base line: the many, faint, anonymous -->
  <g stroke="#F7F3EA" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="680" x2="1400" y2="680"/>
  </g>
  <g fill="#F7F3EA" fill-opacity="0.18">
    <circle cx="120" cy="680" r="2.5"/><circle cx="200" cy="680" r="2.5"/><circle cx="280" cy="680" r="2.5"/>
    <circle cx="360" cy="680" r="2.5"/><circle cx="440" cy="680" r="2.5"/><circle cx="520" cy="680" r="2.5"/>
    <circle cx="600" cy="680" r="2.5"/><circle cx="680" cy="680" r="2.5"/><circle cx="760" cy="680" r="2.5"/>
    <circle cx="840" cy="680" r="2.5"/><circle cx="920" cy="680" r="2.5"/><circle cx="1000" cy="680" r="2.5"/>
    <circle cx="1080" cy="680" r="2.5"/><circle cx="1160" cy="680" r="2.5"/><circle cx="1240" cy="680" r="2.5"/>
    <circle cx="1320" cy="680" r="2.5"/>
  </g>
</svg>
