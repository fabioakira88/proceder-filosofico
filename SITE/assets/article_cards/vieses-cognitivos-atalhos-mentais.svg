<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Perfil simplificado de cabeça humana atravessado por linhas retas que se curvam ao entrar, simbolizando a distorção do julgamento pelos vieses cognitivos">
  <defs>
    <linearGradient id="vc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061E47"/>
      <stop offset="1" stop-color="#060D1E"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#vc-bg)"/>

  <!-- incoming straight rays (raw evidence), from the left -->
  <g stroke="#F7F3EA" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="230" x2="640" y2="310"/>
    <line x1="0" y1="330" x2="640" y2="365"/>
    <line x1="0" y1="440" x2="640" y2="430"/>
    <line x1="0" y1="540" x2="640" y2="480"/>
  </g>

  <!-- clean head profile facing right: skull circle + brow + nose + lips + chin + neck -->
  <g fill="#C9A84C" fill-opacity="0.20" stroke="#C9A84C" stroke-width="2.5" stroke-opacity="0.9">
    <path d="
      M 840 394
      A 150 150 0 1 0 766 522
      L 766 460
      C 740 452 720 440 704 424
      C 688 408 682 396 664 394
      C 650 392 642 384 648 372
      C 654 362 658 356 652 344
      C 648 334 652 324 662 320
      C 656 306 662 292 676 288
      C 670 274 680 262 694 264
      C 700 244 720 234 738 244
      C 752 220 784 216 802 236
      C 834 250 854 278 860 312
      C 888 328 906 358 906 394
      Z"/>
  </g>
  <circle cx="724" cy="360" r="6" fill="#C9A84C"/>
  <path d="M 704 500 L 640 500 L 620 560 L 740 560 Z" fill="#C9A84C" fill-opacity="0.20" stroke="#C9A84C" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- bent / distorted rays after crossing into the head -->
  <g stroke="#E6D28A" stroke-width="2.6" fill="none" opacity="0.95" stroke-linecap="round">
    <path d="M 648 372 Q 760 260 1020 210"/>
    <path d="M 652 344 Q 740 280 1050 260"/>
    <path d="M 664 394 Q 730 460 1060 430"/>
    <path d="M 704 424 Q 780 520 1020 540"/>
  </g>
  <g fill="#E6D28A">
    <circle cx="1020" cy="210" r="5"/>
    <circle cx="1050" cy="260" r="5"/>
    <circle cx="1060" cy="430" r="5"/>
    <circle cx="1020" cy="540" r="5"/>
  </g>

  <!-- faint ground line -->
  <g stroke="#F7F3EA" stroke-opacity="0.05">
    <line x1="0" y1="700" x2="1400" y2="700"/>
    <line x1="0" y1="650" x2="1400" y2="650"/>
  </g>
</svg>
