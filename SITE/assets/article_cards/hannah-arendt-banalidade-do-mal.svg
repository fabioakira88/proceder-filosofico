<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Uma grade de fichas idênticas, cada uma carimbada com a mesma marca circular, repetidas sem variação, simbolizando a burocracia mecânica e sem pensamento crítico">
  <defs>
    <linearGradient id="ha-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060D1E"/>
      <stop offset="1" stop-color="#061E47"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#ha-bg)"/>

  <!-- grid of identical bureaucratic file cards, each with the same stamp -->
  <g>
    <g stroke="#F7F3EA" stroke-width="1.6" stroke-opacity="0.4" fill="#F7F3EA" fill-opacity="0.03">
      <rect x="260" y="140" width="190" height="130"/>
      <rect x="490" y="140" width="190" height="130"/>
      <rect x="720" y="140" width="190" height="130"/>
      <rect x="950" y="140" width="190" height="130"/>

      <rect x="260" y="310" width="190" height="130"/>
      <rect x="490" y="310" width="190" height="130"/>
      <rect x="720" y="310" width="190" height="130"/>
      <rect x="950" y="310" width="190" height="130"/>

      <rect x="260" y="480" width="190" height="130"/>
      <rect x="490" y="480" width="190" height="130"/>
      <rect x="720" y="480" width="190" height="130"/>
      <rect x="950" y="480" width="190" height="130"/>
    </g>
    <!-- identical stamp mark, same size, same angle, on every card -->
    <g stroke="#C9A84C" stroke-width="2.2" stroke-opacity="0.65" fill="none">
      <g transform="translate(355,205) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(585,205) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(815,205) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(1045,205) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>

      <g transform="translate(355,375) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(585,375) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(815,375) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(1045,375) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>

      <g transform="translate(355,545) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(585,545) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(815,545) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
      <g transform="translate(1045,545) rotate(-12)"><circle r="34"/><line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/></g>
    </g>
  </g>
</svg>
