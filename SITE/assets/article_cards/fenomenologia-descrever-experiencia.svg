<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-label="Anéis concêntricos ao redor de um ponto central luminoso, como uma íris que se abre, simbolizando a descrição pura da experiência antes de qualquer explicação">
  <defs>
    <linearGradient id="fe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060D1E"/>
      <stop offset="1" stop-color="#061E47"/>
    </linearGradient>
    <radialGradient id="fe-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7F3EA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E6D28A" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#fe-bg)"/>

  <g transform="translate(700,394)">
    <circle r="30" fill="url(#fe-core)"/>
    <circle r="70" fill="none" stroke="#E6D28A" stroke-width="1.6" stroke-opacity="0.75"/>
    <circle r="120" fill="none" stroke="#E6D28A" stroke-width="1.3" stroke-opacity="0.55"/>
    <circle r="180" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-opacity="0.4"/>
    <circle r="250" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.28"/>
    <circle r="330" fill="none" stroke="#F7F3EA" stroke-width="0.8" stroke-opacity="0.16"/>

    <!-- subtle aperture segments, like an iris opening -->
    <g stroke="#F7F3EA" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="0" y1="-70" x2="0" y2="-330"/>
      <line x1="0" y1="70" x2="0" y2="330"/>
      <line x1="-70" y1="0" x2="-330" y2="0"/>
      <line x1="70" y1="0" x2="330" y2="0"/>
      <line x1="-49" y1="-49" x2="-233" y2="-233"/>
      <line x1="49" y1="-49" x2="233" y2="-233"/>
      <line x1="-49" y1="49" x2="-233" y2="233"/>
      <line x1="49" y1="49" x2="233" y2="233"/>
    </g>
  </g>
</svg>
